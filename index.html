label{display:block;font-size:11px;color:#b5b5b5;margin:14px 0 6px;letter-spacing:1.5px}
/* glass inputs */
input[type=text],input[type=password]{width:100%;padding:14px 15px;border-radius:16px;color:#fff;font-size:15px;outline:none;
background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);

input[type=text]:focus,input[type=password]:focus{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.6);box-shadow:0 0 0 4px rgba(255,255,255,.08),0 0 24px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.2);transform:translateY(-1px)}

box-shadow:0 10px 30px rgba(255,255,255,.14),inset 0 1px 0 #fff;transition:transform .2s ease,box-shadow .3s ease}
button:after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.9),transparent);transform:skewX(-20deg);animation:sheen2 3.5s ease-in-out 2.5s infinite}
@keyframes sheen2{0%{left:-80%}40%,100%{left:160%}}
button:active{transform:scale(.96)}
button:disabled{opacity:.6;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.85}}
.bar{height:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:8px;margin-top:20px;overflow:hidden;box-shadow:inset 0 1px 4px rgba(0,0,0,.4)}

@keyframes shim{to{background-position:-200% 0}}

function fmtSize(b){
  const u = ['B','KB','MB','GB','TB','PB']; let i = 0, n = b;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : n >= 10 ? 1 : 2)) + ' ' + u[i];
}

async function gh(path, token, method = 'GET', body) {
  const r = await fetch('https://api.github.com' + path, {
    method,
    headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined

  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.message || ('HTTP ' + r.status));

    errs.forEach((m, i) => setTimeout(() => toast('err', m), i * 170));
    bad.forEach(el => { el.classList.add('bad'); setTimeout(() => el.classList.remove('bad'), 2200); });
    return setStatus('⚠️ ' + errs.length + (errs.length > 1 ? ' Ꭼʀʀᴏʀs Ꭰᴇᴛᴇᴄᴛᴇᴅ' : 'Ꭼʀʀᴏʀs Ꭰᴇᴛᴇᴄᴛᴇᴅ'));
  }
  try { localStorage.setItem('cap_repo', repo); localStorage.setItem('cap_branch', branch); } catch (e) {}

  $('go').disabled = true;
  try {
    setStatus('📖 Ꭱᴇᴀᴅɪɴɢ ᴢɪᴘ...', 3);
    const zip = await JSZip.loadAsync(file);
    let entries = Object.values(zip.files).filter(f => !f.dir && !f.name.startsWith('__MACOSX') && !f.name.endsWith('.DS_Store'));
    if (!entries.length) throw new Error('Zip is Empty');

    let prefix = '';
    if ($('strip').checked) {
      const tops = new Set(entries.map(f => f.name.split('/')[0]));
      if (tops.size === 1 && entries.every(f => f.name.includes('/'))) prefix = [...tops][0] + '/';
    }

    setStatus('🔎 Ꮯʜᴇᴄᴋɪɴɢ ʙʀᴀɴᴄʜ...', 6);
    let parent = null, baseTree = null;
    try {
      const ref = await gh(`/repos/${repo}/git/ref/heads/${branch}`, token);
      parent = ref.object.sha;
      baseTree = (await gh(`/repos/${repo}/git/commits/${parent}`, token)).tree.sha;
    } catch (e) { /* new/empty branch */ }

    const tree = [];
    for (let i = 0; i < entries.length; i++) {
      const f = entries[i];
      setStatus(`⬆️ ᴜᴘʟᴏᴀᴅɪɴɢ ${i + 1}/${entries.length}: ${f.name.slice(prefix.length)}`, 10 + (i / entries.length) * 75);
      const b64 = await f.async('base64');
      const blob = await gh(`/repos/${repo}/git/blobs`, token, 'POST', { content: b64, encoding: 'base64' });
      tree.push({ path: (folder ? folder + '/' : '') + f.name.slice(prefix.length), mode: '100644', type: 'blob', sha: blob.sha });
    }

    setStatus('⚙️ Ᏼᴜɪʟᴅɪɴɢ ᴄᴏᴍᴍɪᴛ...', 88);
    const newTree = await gh(`/repos/${repo}/git/trees`, token, 'POST', baseTree ? { base_tree: baseTree, tree } : { tree });
    const commit = await gh(`/repos/${repo}/git/commits`, token, 'POST', {
      message: userMsg.includes(CREDIT) ? userMsg : (userMsg ? userMsg + ' ' : '') + CREDIT, tree: newTree.sha, parents: parent ? [parent] : []
    });

    setStatus('🚀 Ꮲᴜsʜɪɴɢ...', 95);
    if (parent) await gh(`/repos/${repo}/git/refs/heads/${branch}`, token, 'PATCH', { sha: commit.sha, force: false });
    else await gh(`/repos/${repo}/git/refs`, token, 'POST', { ref: 'refs/heads/' + branch, sha: commit.sha });

    setStatus(`✅ Ꭰᴏɴᴇ! ${entries.length} ғɪʟᴇs ᴘᴜsʜᴇᴅ ᴛᴏ ${repo}@${branch}`, 100); window._afterOk = () => { toast('ok', '✅ Done!'); setTimeout(() => toast('ok', '🚀 Upload Successful'), 650); }; showSuccess(entries.length, repo, branch);
  } catch (e) {
    setStatus('❌ ' + e.message, 0); toast('err', '❌ ' + e.message);
  }
  $('go').disabled = false;
});
</script>
<script>
/* background animations: loader = Starfield Warp, page = Particle Network (time-based, resize-safe) */
(function(){
  const R=(a,b)=>a+Math.random()*(b-a);
  function star(s){
    const st=Array.from({length:200},()=>({x:R(-1,1),y:R(-1,1),z:R(.05,1)}));
    return function(){const x=s.x,W=s.W,H=s.H;x.fillStyle='#000';x.fillRect(0,0,W,H);const cx=W/2,cy=H/2,k=Math.max(W,H)*.6;
      st.forEach(a=>{const pz=a.z;a.z-=.008*s.k;if(a.z<=.02){a.x=R(-1,1);a.y=R(-1,1);a.z=1;return}
        const x1=cx+a.x/a.z*k*.3,y1=cy+a.y/a.z*k*.3,x0=cx+a.x/pz*k*.3,y0=cy+a.y/pz*k*.3;
        x.strokeStyle='rgba(255,255,255,'+(1-a.z)+')';x.lineWidth=(1-a.z)*2.2;x.beginPath();x.moveTo(x0,y0);x.lineTo(x1,y1);x.stroke()})};
  }
  function net(s){
    const N=Math.min(60,Math.floor(s.W*s.H/9000));
    const p=Array.from({length:N},()=>({x:R(0,s.W),y:R(0,s.H),vx:R(-.4,.4),vy:R(-.4,.4)}));
    const NB=5,bk=Array.from({length:NB},()=>[]),L=120,L2=L*L;
    const f=function(){const x=s.x,W=s.W,H=s.H,k=s.k;x.fillStyle='#050505';x.fillRect(0,0,W,H);
      for(let i=0;i<N;i++){const a=p[i];a.x+=a.vx*k;a.y+=a.vy*k;if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1}
      for(let i=0;i<NB;i++)bk[i].length=0;
      for(let i=0;i<N;i++){const a=p[i];
        for(let j=i+1;j<N;j++){const b=p[j],dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;
          if(d2<L2){const t=Math.min(NB-1,(Math.sqrt(d2)/L*NB)|0);bk[t].push(a.x,a.y,b.x,b.y)}}}
      x.lineWidth=1;
      for(let i=0;i<NB;i++){const q=bk[i];if(!q.length)continue;
        x.strokeStyle='rgba(255,255,255,'+(.35*(1-(i+.5)/NB)).toFixed(3)+')';x.beginPath();
        for(let m=0;m<q.length;m+=4){x.moveTo(q[m],q[m+1]);x.lineTo(q[m+2],q[m+3])}x.stroke()}
      x.fillStyle='rgba(255,255,255,.8)';x.beginPath();
      for(let i=0;i<N;i++){const a=p[i];x.moveTo(a.x+1.8,a.y);x.arc(a.x,a.y,1.8,0,7)}x.fill()};
    f.resize=(ow,oh)=>p.forEach(a=>{a.x*=s.W/ow;a.y*=s.H/oh});   // keep the dots where they were when the screen turns
    return f;
  }
  let busy=false;                                                    // true while zooming / rotating / resizing
  function run(id,build,stopMs,maxDpr,maxPx){
    const cv=document.getElementById(id);if(!cv)return;
    const s={x:cv.getContext('2d'),W:0,H:0,k:1};let draw=null,on=true;
    function rs(){
      if(!cv.isConnected)return;
      const ow=s.W||1,oh=s.H||1;
      cv.style.width='';cv.style.height='';
      const W=cv.clientWidth||innerWidth,H=cv.clientHeight||innerHeight;
      const D=Math.max(.6,Math.min(devicePixelRatio||1,maxDpr,Math.sqrt((maxPx||1e9)/(W*H))));   // pixel budget: huge desktop-mode canvases stay light
      s.W=W;s.H=H;cv.style.width=W+'px';cv.style.height=H+'px';
      cv.width=W*D;cv.height=H*D;s.x.setTransform(D,0,0,D,0,0);
      if(!draw)draw=build(s);else if(draw.resize)draw.resize(ow,oh);
      draw();
    }
    rs();
    let last=performance.now();
    (function loop(){if(!on)return;const n=performance.now();
      const gap=(s.W*s.H>1.2e6)?30:0;                                    // huge canvas: 30 fps is plenty
      if(busy)last=n;                                                    // zooming / panning: no drawing at all
      else if(n-last>=gap){s.k=Math.min(Math.max((n-last)/16.667,.2),3);draw();last=n}
      requestAnimationFrame(loop)})();
    if(stopMs)setTimeout(()=>{on=false},stopMs);
    return {rs,stop:()=>{on=false}};
  }
  const jobs=[run('cvL',star,3400,1.5,1.3e6),run('cvM',net,0,1.5,1.3e6)].filter(Boolean);
  /* one debounced resize: canvases are re-allocated ONCE after zoom/rotate settles, not on every step */
  const root=document.documentElement;let lw=innerWidth,tm=0;
  function done(){busy=false;root.classList.remove('resizing');
    if(innerWidth!==lw){lw=innerWidth;jobs.forEach(j=>j.rs())}}
  function hold(){busy=true;root.classList.add('resizing');clearTimeout(tm);tm=setTimeout(done,180)}
  addEventListener('resize',hold,{passive:true});
  /* pinch-zoom / panning while zoomed (visual viewport): pause every moving thing until the fingers stop */
  const vv=window.visualViewport;
  if(vv){vv.addEventListener('resize',hold,{passive:true});vv.addEventListener('scroll',hold,{passive:true})}
  /* loader is gone after its fade: free its canvas */
  const ld=document.getElementById('loader');
  if(ld)ld.addEventListener('animationend',e=>{if(e.animationName==='hide'){jobs[0]&&jobs[0].stop();ld.remove()}});
})();
</script>
<script>
/* random green / blue loading bar on every refresh */
(function(){
  const g=Math.random()<.5, r=document.documentElement.style;
  r.setProperty('--b1',g?'rgba(0,255,106,.55)':'rgba(0,160,255,.55)');
  r.setProperty('--b2',g?'#00ff6a':'#00b4ff');
  r.setProperty('--bg',g?'#00ff6a':'#00b4ff');
})();
</script>
<script>
/* toasts + success popup */
const IG_USER = 'mr_captain_ofc'; // <- change to your Instagram username
function toast(type, msg){
  const box = document.getElementById('toasts'), t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = msg; box.appendChild(t);
  t.animate([{ opacity: 0, transform: 'translateX(90px) scale(.92)' }, { opacity: 1, transform: 'translateX(0) scale(1)' }],
            { duration: 520, easing: 'cubic-bezier(.2,.9,.25,1)', fill: 'backwards' });
  setTimeout(() => closeToast(t), 4200);
}
function closeToast(t){
  if (t._c || !t.parentNode) return; t._c = 1;
  const a = t.animate([{ opacity: 1, transform: 'translateX(0) scale(1)' }, { opacity: 0, transform: 'translateX(90px) scale(.92)' }],
                      { duration: 420, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' });
  a.onfinish = () => {
    const box = t.parentNode; if (!box) return;
    const sibs = [...box.children].filter(e => e !== t), before = sibs.map(e => e.getBoundingClientRect().top);
    t.remove();
    sibs.forEach((e, i) => { const dy = before[i] - e.getBoundingClientRect().top;
      if (dy) e.animate([{ transform: 'translateY(' + dy + 'px)' }, { transform: 'translateY(0)' }], { duration: 380, easing: 'cubic-bezier(.2,.9,.25,1)', composite: 'add' }); });
  };
}
function showSuccess(n, repo, branch){
  const ig = document.getElementById('iglink'); ig.style.pointerEvents = 'none'; setTimeout(() => ig.style.pointerEvents = '', 900);
  document.getElementById('igname').textContent = '@' + IG_USER;
  document.getElementById('iglink').href = 'https://instagram.com/' + IG_USER;
  document.getElementById('okpop').classList.add('show');
}
function closeOk(){ document.getElementById('okpop').classList.remove('show'); const f = window._afterOk; window._afterOk = null; if (f) setTimeout(f, 280); }
document.getElementById('okclose').addEventListener('click', closeOk);
document.getElementById('okpop').addEventListener('click', e => { if (e.target.id === 'okpop') closeOk(); });
</script>
<script>
/* paste button for the token field */
document.getElementById('paste').addEventListener('click', async () => {
  try {
    const t = (await navigator.clipboard.readText()).trim();
    if (!t) return toast('err', 'Clipboard is empty');
    document.getElementById('token').value = t;
  } catch (e) { toast('err', 'Allow clipboard access, or long-press the field and paste'); }
});
</script>
<script>
/* PC layout: reuse the card's own heading / credit (keeps your edits) */
(function(){
  const c=document.querySelector('.card');
  const ph=document.getElementById('pchead'), pf=document.getElementById('pcfoot');
  const h=c.querySelector('h1');h.dataset.t=h.textContent;
  ph.appendChild(h.cloneNode(true));
  ph.appendChild(c.querySelector('.sub').cloneNode(true));
  pf.appendChild(c.querySelector('.foot').cloneNode(true));
})();
</script>
<script>
/* rotate the phone: title, subtitle and credit re-enter, slow and soft.
   sideways = letters spread out; back to normal = glide in with a gentle blur */
(function(){
  const E='cubic-bezier(.22,.61,.36,1)';
  const SET={
    land:{
      title:{kf:[{opacity:0,letterSpacing:'14px',filter:'blur(8px)'},{opacity:1,letterSpacing:'3px',filter:'blur(0px)'}],dur:900,delay:0},
      sub:{kf:[{opacity:0,transform:'translateY(-14px)',filter:'blur(6px)'},{opacity:1,transform:'translateY(0)',filter:'blur(0px)'}],dur:800,delay:120},
      foot:{kf:[{opacity:0,transform:'translateY(22px)'},{opacity:1,transform:'translateY(0)'}],dur:800,delay:220}
    },
    port:{
      title:{kf:[{opacity:0,transform:'translateY(-30px) scale(.9)',filter:'blur(12px)'},{opacity:1,transform:'translateY(0) scale(1)',filter:'blur(0px)'}],dur:1700,delay:0},
      sub:{kf:[{opacity:0,transform:'translateY(16px)',filter:'blur(8px)'},{opacity:1,transform:'translateY(0)',filter:'blur(0px)'}],dur:1500,delay:300},
      foot:{kf:[{opacity:0,transform:'translateY(34px) scale(.92)',filter:'blur(6px)'},{opacity:1,transform:'translateY(0) scale(1)',filter:'blur(0px)'}],dur:1600,delay:550}
    }
  };
  const SEL={title:'.card h1,#pchead h1',sub:'.card .sub,#pchead .sub',foot:'.card .foot,#pcfoot .foot'};
  let running=[],tk=0;
  function replay(){
    const ld=document.getElementById('loader');
    if(ld && getComputedStyle(ld).visibility!=='hidden') return;
    const my=++tk;
    running.forEach(a=>a.cancel());running=[];
    if(!mq.matches) return;                                      // back to normal (portrait): no animation, only when turning sideways
    const all=document.querySelectorAll(Object.values(SEL).join(','));
    all.forEach(el=>el.style.opacity='0');                       // hidden at once: no flash while the layout turns
    requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(()=>{
      if(my!==tk) return;                                        // a newer turn took over
      const set=mq.matches?SET.land:SET.port;
      Object.keys(SEL).forEach(kind=>document.querySelectorAll(SEL[kind]).forEach(el=>{
        if(!el.getClientRects().length) return;
        const o=set[kind];
        const an=el.animate(o.kf,{duration:o.dur,easing:E,delay:o.delay,fill:'both'});
        an.onfinish=()=>{try{an.cancel()}catch(e){}};
        running.push(an);
      }));
      all.forEach(el=>el.style.opacity='');                      // animations now hold the hidden start state
    },120)));                                                    // wait until the new layout has settled
  }
  const mq=matchMedia('(orientation:landscape)');
  if(mq.addEventListener) mq.addEventListener('change',replay); else mq.addListener(replay);
})();
</script>
<script>
/* desktop-site mode on a phone: scale the block so it fills the screen (rotate = normal auto layout) */
(function(){
  const st=document.getElementById('stage'),FILL=.92,MAXZ=2.6;
  const mq=matchMedia('(min-width:700px) and (min-height:561px) and (pointer:coarse)');
  function fit(){
    if(!mq.matches){st.style.removeProperty('--z');return}
    const w=st.offsetWidth,h=st.offsetHeight;if(!w||!h)return;
    const z=Math.max(.5,Math.min(innerWidth*FILL/w,innerHeight*FILL/h,MAXZ));
    st.style.setProperty('--z',z.toFixed(3));
  }
  let t=0;const later=()=>{clearTimeout(t);t=setTimeout(fit,120)};
  fit();addEventListener('load',fit);addEventListener('resize',later,{passive:true});
  if(mq.addEventListener)mq.addEventListener('change',fit);
})();
</script>
<script>
/* keep the page from being scrolled/pushed when a field is focused or text is selected */
addEventListener('scroll',()=>{ if(scrollX||scrollY) scrollTo(0,0); },{passive:true});
</script>
